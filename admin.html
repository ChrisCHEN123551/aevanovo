<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>AEVANOVO · 内容管理</title><style>
:root{--bg:#f2f0ec;--ink:#151412;--muted:#625d56;--line:#d7d1c7;--surface:#faf9f6;--green:#31523c}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;font:14px 'PingFang SC','Helvetica Neue',sans-serif;background:var(--bg);color:var(--ink)}a{color:inherit}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:wait;opacity:.5}a,button,input,textarea{outline-offset:4px}header{padding:24px 5%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:15px}.brand{letter-spacing:-1px;font-size:23px;font-weight:600}.brand small{font-size:12px;font-weight:400;letter-spacing:0;color:var(--muted);margin-left:18px}.header-links{display:flex;gap:20px;font-size:12px}header a{text-decoration:none}.layout{max-width:1360px;margin:auto;display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 85px)}aside{padding:35px 25px 100px;border-right:1px solid var(--line)}.nav-label{font-size:10px;letter-spacing:2px;color:var(--muted);margin-bottom:18px}.tabs{display:flex;flex-direction:column;gap:6px}.tabs button{padding:15px;text-align:left;border:0;background:none;border-radius:4px;color:var(--muted)}.tabs button.active{background:var(--ink);color:white}.sidebar-note{font-size:11px;line-height:1.9;color:var(--muted);margin:35px 10px}main{padding:40px 45px 135px;min-width:0}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:25px}.top h1{font-size:30px;font-weight:400;letter-spacing:-.5px;margin:0}.badge{padding:7px 10px;background:#e2e8dd;color:var(--green);font-size:11px;border-radius:20px;white-space:nowrap}.badge.dirty{background:#eee2c8;color:#6c5127}.subtitle{font-size:13px;color:var(--muted);line-height:1.9;max-width:620px;margin-bottom:30px}.lang-switch{display:flex;gap:5px;margin-bottom:25px}.lang-switch button{padding:9px 17px;border:1px solid var(--line);background:none;min-height:40px}.lang-switch button.active{background:var(--ink);border-color:var(--ink);color:white}.field-card{background:var(--surface);padding:25px 28px;margin-bottom:18px;border:1px solid var(--line);border-radius:5px}.field-card label{display:block;font-size:13px;margin-bottom:12px;line-height:1.6}.field-card small{color:var(--muted);font-size:10px;float:right}input,textarea{width:100%;padding:14px;background:#fff8;border:1px solid var(--line);border-radius:3px;color:var(--ink);line-height:1.8}textarea{min-height:125px;resize:vertical}input:focus,textarea:focus{border-color:var(--ink)}.empty{font-size:14px;color:var(--muted);padding:50px 0}.savebar{position:fixed;bottom:0;left:0;right:0;z-index:10;background:#faf9f6ee;backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:18px 5%;display:flex;justify-content:space-between;align-items:center;gap:20px}.save-meta{font-size:11px;color:var(--muted);line-height:1.8}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.btn{font-size:12px;background:none;border:1px solid var(--line);border-radius:30px;padding:13px 20px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;min-height:42px;color:var(--ink)}.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.btn.subtle{padding:10px 12px;border:0;color:var(--muted)}.status{min-height:24px;font-size:12px;line-height:1.8;color:var(--green);margin-bottom:20px}.status.error{color:#983f32}.error-panel{padding:25px;border:1px solid #983f3255;background:#fff6;line-height:1.9}.dialog{border:1px solid var(--line);border-radius:8px;background:var(--bg);max-width:460px;width:90%;padding:32px;box-shadow:0 30px 100px #0002}.dialog::backdrop{background:#14120f66;backdrop-filter:blur(8px)}.dialog h2{font-weight:400;margin:0 0 16px;font-size:24px}.dialog p{color:var(--muted);line-height:1.9;font-size:13px}.dialog .actions{margin-top:25px;justify-content:end}.mobile-menu{display:none}@media(max-width:800px){header{padding:20px 5%}.brand{font-size:20px}.brand small{display:none}.header-links{gap:15px}.layout{grid-template-columns:1fr}aside{padding:20px 5% 0;border:0}.nav-label,.sidebar-note{display:none}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.tabs button{text-align:center;padding:12px 6px;font-size:12px;background:#e8e4dc}main{padding:25px 5% 195px}.top h1{font-size:26px}.field-card{padding:20px}.savebar{flex-direction:column;align-items:stretch;gap:12px;padding:15px 5%}.actions{gap:7px}.btn{padding:11px 15px}.save-meta{font-size:10px}.savebar .actions .btn.subtle{padding:8px 0;margin-left:auto}.top{gap:10px}}@media(max-width:420px){.savebar .actions .btn{font-size:11px;padding:10px 12px}.badge{font-size:10px}.field-card{padding:18px}.header-links{font-size:11px}.tabs{grid-template-columns:repeat(3,1fr)}}
</style></head><body><header><div class="brand">AEVANOVO <small>品牌内容管理</small></div><div class="header-links"><a href="/" target="_blank" rel="noopener">查看官网 ↗</a><a href="/signout-with-chatgpt?return_to=%2F" target="_top">退出登录</a></div></header><div class="layout"><aside><div class="nav-label">CONTENT STUDIO</div><nav class="tabs" aria-label="内容分组"><button data-group="home" class="active">首页展示</button><button data-group="brand">品牌介绍</button><button data-group="science">技术平台</button><button data-group="products">产品板块</button><button data-group="contact">联系方式</button></nav><p class="sidebar-note">内容先保存到草稿。<br>点击发布后，访客才会看到更新。<br><br>中文和英文可分别修改。<br>已有版式与动画会自动保留。</p></aside><main><div class="top"><h1 id="sectionTitle">首页展示</h1><span id="badge" class="badge">正在载入</span></div><p class="subtitle" id="sectionIntro">修改标题与介绍文字。换行会保留在网页中；中文与英文分别编辑。</p><div class="status" id="status" role="status" aria-live="polite"></div><div class="lang-switch" id="langSwitch"><button data-lang="zh" class="active">中文内容</button><button data-lang="en">English</button></div><div id="fields"><div class="empty">正在读取云端内容…</div></div></main></div><div class="savebar"><div class="save-meta"><div id="savedTime">尚未载入</div><div id="publishedTime">官网内容与草稿分开保存</div></div><div class="actions"><button class="btn" id="save" disabled>保存草稿</button><a class="btn" href="/admin/preview" target="_blank" rel="noopener" id="preview">预览草稿 ↗</a><button class="btn primary" id="publish" disabled>发布到官网 ↗</button><button class="btn subtle" id="restore" disabled>恢复上次发布</button></div></div><dialog class="dialog" id="confirmPublish"><h2>发布这次修改？</h2><p>修改将保存并发布到公开官网，所有访客都能看到。如果需要检查效果，可以先保存草稿并预览。</p><div class="actions"><button class="btn" id="cancelPublish">继续编辑</button><button class="btn primary" id="doPublish">确认发布</button></div></dialog><script>
(function(){'use strict';var SCHEMA=__EDITOR_SCHEMA__,data=null,revision=0,lang='zh',group='home',dirty=false,busy=false,previous=false,unpublished=false;var titles={home:'首页展示',brand:'品牌介绍',science:'技术平台',products:'产品板块',contact:'联系方式'};var descriptions={home:'修改三幕首页的标题与介绍。换行会保留在网页中；中文与英文分别编辑。',brand:'修改品牌简介与品牌理念，清晰传达艾芙诺的定位。',science:'修改技术平台的四个方向，保持研发与应用信息准确。',products:'修改五个产品板块的名称与介绍。修改名称后，首页分类入口与咨询选项会同步更新。',contact:'填写真实商务邮箱、电话与地址。留空的项不会在官网展示。'};
var fields=document.getElementById('fields'),status=document.getElementById('status');function message(t,error){status.textContent=t;status.classList.toggle('error',!!error)}function time(s){return s?new Date(s).toLocaleString('zh-CN'):'尚无记录'}
function setBusy(v){busy=v;['save','publish','restore'].forEach(function(id){document.getElementById(id).disabled=v||!data||(id==='restore'&&!previous)});document.querySelectorAll('#fields input,#fields textarea,.tabs button,.lang-switch button').forEach(function(el){el.disabled=v})}
function badge(){var el=document.getElementById('badge');el.textContent=dirty?'有未保存修改':unpublished?'有未发布草稿':'与官网同步';el.classList.toggle('dirty',dirty||unpublished)}function changed(){dirty=true;badge();message('修改尚未保存。')}
function render(){document.getElementById('sectionTitle').textContent=titles[group];document.getElementById('sectionIntro').textContent=descriptions[group];document.getElementById('langSwitch').hidden=group==='contact';fields.replaceChildren();if(!data)return;var list=group==='contact'?[{id:'email',label:'商务邮箱',type:'email'},{id:'phone',label:'商务电话',type:'tel'},{id:'address',label:'联系地址',type:'text'}]:SCHEMA.filter(function(x){return x.group===group});list.forEach(function(f){var box=document.createElement('div');box.className='field-card';var label=document.createElement('label');label.htmlFor='field-'+f.id;label.textContent=f.label;var small=document.createElement('small');small.textContent=group==='contact'?'选填':lang==='zh'?'中文':'EN';label.appendChild(small);var input=document.createElement(group==='contact'?'input':'textarea');input.id='field-'+f.id;if(group==='contact'){input.type=f.type;input.value=data.contact[f.id];input.maxLength=500}else{input.value=data.fields[f.id][lang];input.maxLength=5000;input.rows=f.multiline?5:2}input.addEventListener('input',function(){if(group==='contact')data.contact[f.id]=input.value;else data.fields[f.id][lang]=input.value;changed()});box.append(label,input);fields.appendChild(box)});badge();setBusy(busy)}
function accept(r){data=r.content;revision=r.revision;previous=r.hasPrevious;unpublished=r.hasUnpublished;dirty=false;document.getElementById('savedTime').textContent='草稿保存：'+time(r.updatedAt);document.getElementById('publishedTime').textContent='最近发布：'+time(r.publishedAt);badge()}
async function api(action){var payload={action:action,revision:revision};if(action==='save')payload.content=data;var r=await fetch('/api/admin/content',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),credentials:'same-origin'}),result=await r.json();if(!r.ok){if(r.status===401)throw new Error('登录已过期，请重新登录后操作。');throw new Error(result.error||'操作失败，请重试')}accept(result)}
async function load(){setBusy(true);try{var r=await fetch('/api/admin/content',{cache:'no-store',credentials:'same-origin'}),result=await r.json();if(!r.ok)throw new Error(result.error||'内容读取失败');accept(result);render();message('内容已从云端载入。')}catch(e){message(e.message,true);fields.replaceChildren();var panel=document.createElement('div');panel.className='error-panel';panel.textContent='暂时无法读取内容。请刷新重试；原有官网内容仍可正常访问。';var retry=document.createElement('button');retry.className='btn';retry.textContent='重新载入';retry.onclick=load;panel.append(document.createElement('br'),retry);fields.appendChild(panel)}finally{setBusy(false)}}
async function save(){if(busy||!data)return;setBusy(true);try{await api('save');message('草稿已保存。你可以预览效果，官网尚未更新。')}catch(e){message(e.message,true)}finally{setBusy(false)}}
document.querySelectorAll('[data-group]').forEach(function(b){b.onclick=function(){group=b.dataset.group;document.querySelectorAll('[data-group]').forEach(function(x){x.classList.toggle('active',x===b)});render();window.scrollTo({top:0,behavior:'instant'})}});document.querySelectorAll('[data-lang]').forEach(function(b){b.onclick=function(){lang=b.dataset.lang;document.querySelectorAll('[data-lang]').forEach(function(x){x.classList.toggle('active',x===b)});render()}});document.getElementById('save').onclick=save;
document.getElementById('preview').onclick=function(e){if(dirty||!data||busy){e.preventDefault();message(dirty?'请先保存草稿，再查看预览。':'请等待内容载入完成。',true)}};
var confirm=document.getElementById('confirmPublish');document.getElementById('publish').onclick=function(){if(!busy&&data)confirm.showModal()};document.getElementById('cancelPublish').onclick=function(){confirm.close()};document.getElementById('doPublish').onclick=async function(){confirm.close();setBusy(true);try{if(dirty)await api('save');await api('publish');message('发布成功，访客现在可以看到新版内容。')}catch(e){message(e.message,true)}finally{setBusy(false)}};
document.getElementById('restore').onclick=async function(){if(busy||!previous)return;if(dirty){message('请先保存当前修改，再恢复上一版。',true);return}setBusy(true);try{await api('restore');render();message('上次发布的内容已恢复为草稿。检查并点击发布后才会更新官网。')}catch(e){message(e.message,true)}finally{setBusy(false)}};window.addEventListener('beforeunload',function(e){if(dirty){e.preventDefault();e.returnValue=''}});load();
})();
</script></body></html>
